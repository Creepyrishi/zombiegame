<!doctype html>
<html lang="EN-us">
  <head>
    <meta charset="utf-8">
    <title>Some Kind of Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin: 0; overflow: hidden; background-color: #1a1a2e;
        display: flex; align-items: center; justify-content: center;
        width: 100vw; height: 100vh;
      }
      canvas.emscripten { border: 0 none; background-color: #1a1a2e; }
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: #e0e0e0; font-family: 'Courier New', monospace;
        background: #1a1a2e; z-index: 10;
      }
      #loading.hidden { display: none; }
      #loading h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #e94560; }
      #loading p { font-size: 1rem; opacity: 0.7; }
      .spinner {
        width: 40px; height: 40px; margin: 20px;
        border: 4px solid #16213e; border-top: 4px solid #e94560;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #mobile-warning {
        display: none;
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        align-items: center; justify-content: center;
        background: #1a1a2e; z-index: 30;
        color: #e0e0e0; font-family: 'Courier New', monospace;
        text-align: center; padding: 20px; box-sizing: border-box;
      }
      #mobile-warning h2 { color: #e94560; font-size: 1.5rem; margin-bottom: 1rem; }
      #mobile-warning p { font-size: 1rem; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Some Kind of Game</h1>
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    <div id="mobile-warning">
      <div>
        <h2>Some Kind of Game</h2>
        <p>This game requires a keyboard.</p>
        <p>Open it on a desktop or laptop.</p>
      </div>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="error" style="display:none;position:fixed;top:0;left:0;width:100%;padding:20px;color:#e94560;font-family:monospace;background:#1a1a2e;z-index:20;white-space:pre-wrap;"></div>
    <script>
      function hideLoading() {
        document.getElementById('loading').classList.add('hidden');
      }
      var Module = {
        canvas: document.getElementById('canvas'),
        onRuntimeInitialized: hideLoading,
        onAbort: function(msg) {
          document.getElementById('error').textContent = 'Abort: ' + msg;
          document.getElementById('error').style.display = 'block';
          hideLoading();
        }
      };
      setTimeout(hideLoading, 15000);
      window.onerror = function(msg, url, line) {
        var el = document.getElementById('error');
        el.textContent = 'Error: ' + msg + '\n' + url + ':' + line;
        el.style.display = 'block';
        hideLoading();
      };
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('mobile-warning').style.display = 'flex';
      }
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
